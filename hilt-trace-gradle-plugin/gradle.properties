# An included build does not read the root gradle.properties, so it keeps its own default.
# The root verifyVersionAlignment task asserts this value matches the root libraryVersion.
# -PlibraryVersion=... and ORG_GRADLE_PROJECT_libraryVersion override every build.
libraryVersion=1.0.0-alpha01
# The publishing convention reads the group; an included build does not read the root file.
libraryGroupId=io.github.santimattius.android

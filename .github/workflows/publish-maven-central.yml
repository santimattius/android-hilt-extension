# Publishes every library module to Maven Central when a GitHub Release is published.
# Each module is published under its own artifact id (the module name) through the
# hiltext.publishing convention plugin. Tag must match the version (e.g. v1.0.0). Version is
# derived by stripping the 'v' prefix and passed to every build, included builds too, through
# ORG_GRADLE_PROJECT_libraryVersion (an included build does not read the root gradle.properties).
#
# Required GitHub Secrets:
#   MAVEN_CENTRAL_USERNAME  - Sonatype Central token username (from Central Portal)
#   MAVEN_CENTRAL_PASSWORD  - Sonatype Central token password
#   SIGNING_KEY             - ASCII-armored GPG private key (gpg --export-secret-keys --armor <key-id>)
#   SIGNING_KEY_PASSWORD    - (optional) Passphrase for the GPG key
#   SIGNING_KEY_ID          - (optional) GPG key ID (e.g. 8 chars), if not set the key is read from SIGNING_KEY

name: Publish to Maven Central

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish Libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 25 matches the Gradle daemon JVM pinned in gradle/gradle-daemon-jvm.properties.
      # Library bytecode still targets JVM 17 (set by the hiltext.* convention plugins).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION (from tag $TAG)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Run from the root, publishToMavenCentral selects the task in every module that applies
      # hiltext.publishing (hilt-trace-runtime, hilt-trace-compiler, hilt-coroutines-runtime).
      - name: Publish modules to Maven Central
        env:
          ORG_GRADLE_PROJECT_libraryVersion: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
        run: ./gradlew publishToMavenCentral --configuration-cache

      # An included build's tasks are not selected by name from the root, so the Gradle plugin is
      # published with its own invocation. Skipped until the included build exists.
      - name: Publish Gradle plugin to Maven Central
        if: ${{ hashFiles('hilt-trace-gradle-plugin/settings.gradle.kts') != '' }}
        env:
          ORG_GRADLE_PROJECT_libraryVersion: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
        run: ./gradlew -p hilt-trace-gradle-plugin publishToMavenCentral --configuration-cache

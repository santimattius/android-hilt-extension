# Consumer compatibility: builds a minimal throwaway app (compat/consumer) on the oldest validated
# toolchain against artifacts published to a local Maven repository, then checks that the debug
# dex carries the Hilt trace instrumentation and the release dex does not.
# The consumer is not part of the main build; compat/run.sh runs the same steps locally.

name: Compatibility

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main, master, 'feat/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  consumer:
    name: Consumer (AGP ${{ matrix.agp }}, Kotlin ${{ matrix.kotlin }}, Hilt ${{ matrix.hilt }}, minSdk ${{ matrix.minsdk || '24' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { agp: "9.1.1", kotlin: "2.2.21", hilt: "2.59.2", ksp: "2.3.13" }
          - { agp: "9.1.1", kotlin: "2.2.21", hilt: "2.60.1", ksp: "2.3.13" }
          # minSdk probe: the published libraries declare minSdk 24, so a minSdk 23 consumer must be
          # rejected by the manifest merger. The job fails if that stops being true (see docs/SETUP.md).
          - { agp: "9.1.1", kotlin: "2.2.21", hilt: "2.60.1", ksp: "2.3.13", minsdk: "23", expect_rejection: "1" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # JDK 25 runs this repository's build (gradle/gradle-daemon-jvm.properties); JDK 21 runs the
      # consumer build, which is the JDK the combination was validated with.
      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: |
            21
            25
          cache: "gradle"

      - name: Grant execute permission for scripts
        run: chmod +x gradlew compat/run.sh compat/check-dex.sh

      # Publishes the three libraries and the plugin to a temporary local repository without
      # signing (the opt-out exists only for this job), then builds the consumer.
      - name: Build consumer against locally published artifacts
        run: |
          export COMPAT_JAVA_HOME="$JAVA_HOME_21_X64"
          export COMPAT_EXPECT_MIN_SDK_REJECTION="${{ matrix.expect_rejection || '0' }}"
          compat/run.sh "${{ matrix.agp }}" "${{ matrix.kotlin }}" "${{ matrix.hilt }}" "${{ matrix.ksp }}" "${{ matrix.minsdk || '24' }}"

  # Evidence-only API 23 probe. The libraries still declare minSdk 24 (the manifest-merger rejection above
  # stays asserted); here the check is overridden only in the throwaway consumer (tools:overrideLibrary in
  # compat/consumer/src/probe) and a minimal smoke test runs on an API 23 emulator. A Gradle Managed Device
  # cannot be used: AGP documents managed devices for API 27 and higher. Result is evidence, not support.
  api23-probe:
    name: API 23 probe (override in the consumer only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: |
            21
            25
          cache: "gradle"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for scripts
        run: chmod +x gradlew compat/run.sh compat/check-dex.sh

      - name: Run the smoke test on an API 23 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: default
          arch: x86
          disable-animations: true
          # The action runs every line of `script` in its own `sh -c`, so exports do not carry over to the
          # next line (the first run lost COMPAT_API23_PROBE and fell back to the minSdk rejection check).
          # Keep the variables and the command on one line.
          script: env COMPAT_JAVA_HOME="$JAVA_HOME_21_X64" COMPAT_API23_PROBE=run compat/run.sh 9.1.1 2.2.21 2.60.1 2.3.13 23

      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api23-probe-reports
          path: |
            compat/consumer/build/reports/androidTests/
            compat/consumer/build/outputs/androidTest-results/
          if-no-files-found: ignore

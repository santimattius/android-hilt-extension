# CI: build and test on push and pull requests.
# Release publishing is handled by publish-maven-central.yml (on release published).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, 'feat/**']

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and run tests
        run: ./gradlew build --no-configuration-cache

# CI: build and test on push and pull requests.
# Release publishing is handled by publish-maven-central.yml (on release published).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, 'feat/**']

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # JDK 25 matches the Gradle daemon JVM pinned in
      # gradle/gradle-daemon-jvm.properties. Library bytecode still targets
      # JVM 17 (set by the hiltext.* convention plugins).
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The root check also runs the checks of the included builds (build-logic and, once it
      # exists, hilt-trace-gradle-plugin) and verifyVersionAlignment.
      # The instrumented tests need a device, so CI only compiles and packages them: that keeps their
      # sources from rotting without an emulator job.
      - name: Build, run tests and compile the instrumented tests
        run: ./gradlew build :app:assembleDebugAndroidTest :hilt-coroutines-runtime:assembleDebugAndroidTest --configuration-cache

      - name: Test the instrumented-results guard
        run: scripts/test-assert-instrumented-results.sh

      # The minified instrumented APK (R8 over app and tests) is only assembled here; it runs in the
      # instrumented-minified job.
      - name: Assemble the minified instrumented tests
        run: ./gradlew -PtestBuildType=minified :app:assembleMinifiedAndroidTest --configuration-cache

  # Runs the instrumented tests (app and hilt-coroutines-runtime) on a Gradle Managed Device: AGP
  # downloads the aosp-atd API 34 image and boots it headless. Local equivalent: ./gradlew instrumentedTestsCi
  instrumented:
    name: Instrumented tests (managed device)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      # GitHub-hosted Linux runners expose /dev/kvm to the runner user only after this rule is set.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumented tests on the managed device
        run: ./gradlew instrumentedTestsCi --configuration-cache -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      # AGP can finish the Gradle task green while the instrumentation crashed and no test ran; this fails
      # the job unless the result XMLs show tests > 0 and no failures or testRunFailed.
      - name: Assert the instrumented results prove a real run
        if: always()
        run: |
          scripts/assert-instrumented-results.sh 'app/build/outputs/androidTest-results/managedDevice/debug/ci/TEST-*.xml'
          scripts/assert-instrumented-results.sh 'hilt-coroutines-runtime/build/outputs/androidTest-results/managedDevice/debug/ci/TEST-*.xml'

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            hilt-coroutines-runtime/build/reports/androidTests/
            hilt-coroutines-runtime/build/outputs/androidTest-results/
          if-no-files-found: ignore

  # Same suites as above for :app, but against the R8-minified build type (-PtestBuildType=minified), so
  # the minified APK is shown to record slices at runtime. Separate job: AGP has one test build type per
  # build, and the debug run above stays intact. Local equivalent:
  # ./gradlew instrumentedTestsMinifiedCi -PtestBuildType=minified
  instrumented-minified:
    name: Instrumented tests, minified (managed device)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumented tests against the minified build type
        run: ./gradlew instrumentedTestsMinifiedCi -PtestBuildType=minified --configuration-cache -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      # The first run of this job was a false green: the instrumentation crashed, no test ran, and AGP did
      # not fail the task. This step makes that case red.
      - name: Assert the instrumented results prove a real run
        if: always()
        run: scripts/assert-instrumented-results.sh 'app/build/outputs/androidTest-results/managedDevice/minified/ci/TEST-*.xml'

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-minified-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  # Diagnostic only, runs when the minified job failed (for example the guard found a crashed
  # instrumentation): re-runs the same androidTest on a plain emulator and uploads the full logcat, which
  # the managed-device run does not keep when the process crashes at startup. It is never a pass signal.
  instrumented-minified-logcat:
    name: Minified instrumented tests, logcat capture (diagnostic)
    needs: instrumented-minified
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The action runs every line of `script` as its own `sh -c`, so the exit code, the logcat dump and
      # the command share one line.
      - name: Run the minified androidTest and dump logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: Pixel 6
          disable-animations: true
          script: rc=0; ./gradlew :app:connectedMinifiedAndroidTest -PtestBuildType=minified --configuration-cache || rc=$?; adb logcat -d > logcat.txt; exit $rc

      - name: Upload logcat and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-minified-logcat
          path: |
            logcat.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  # Smoke run of the microbenchmark on a Gradle Managed Device. It only proves the benchmark executes end
  # to end: emulator timings are NOT a measurement of overhead and no figure is recorded or claimed. The
  # runner refuses emulators and non-AOT-compiled installs, so -PbenchmarkSmoke=true suppresses those
  # two errors (androidx.benchmark.suppressErrors=EMULATOR,NOT-AOT-COMPILED). Local equivalent: ./gradlew microbenchmarkSmokeCi -PbenchmarkSmoke=true
  benchmark-smoke:
    name: Microbenchmark smoke (managed device)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run the microbenchmark as a smoke test
        run: ./gradlew microbenchmarkSmokeCi -PbenchmarkSmoke=true --configuration-cache -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      # The JSON/report is uploaded for inspection of the run, not as a measurement.
      - name: Upload benchmark smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-output
          path: |
            benchmark-micro/build/reports/androidTests/
            benchmark-micro/build/outputs/androidTest-results/
            benchmark-micro/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: ignore

  # Canary: fails when AGP/Compose stop needing the Compose Preview workaround in app/build.gradle.kts,
  # so the workaround gets removed instead of lingering. Local: app/scripts/check-compose-preview-canary.sh
  compose-preview-canary:
    name: Compose Preview workaround canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Grant execute permission for scripts
        run: chmod +x gradlew app/scripts/check-compose-preview-canary.sh

      - name: Check the workaround is still required
        run: app/scripts/check-compose-preview-canary.sh

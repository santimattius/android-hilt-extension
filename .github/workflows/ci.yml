# CI: build and test on push and pull requests.
# Release publishing is handled by publish-maven-central.yml (on release published).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, 'feat/**']

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # JDK 25 matches the Gradle daemon JVM pinned in gradle/gradle-daemon-jvm.properties.
      # Library bytecode still targets JVM 17 (set by the hiltext.* convention plugins).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The root check also runs the checks of the included builds (build-logic and, once it
      # exists, hilt-trace-gradle-plugin) and verifyVersionAlignment.
      # The instrumented tests need a device, so CI only compiles and packages them: that keeps their
      # sources from rotting without an emulator job.
      - name: Build, run tests and compile the instrumented tests
        run: ./gradlew build :app:assembleDebugAndroidTest :hilt-coroutines-runtime:assembleDebugAndroidTest --configuration-cache

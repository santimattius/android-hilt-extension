# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packages with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

androidMinSdkVersion=24
androidTargetSdkVersion=37

# Lib
libraryGroupId=com.santimattius.android
libraryArtifactId=library
libraryVersion=1.0.0-alpha01

# Maven Central / POM (optional; override for your project; CI uses env vars)
# POM_DESCRIPTION=Your library description
# POM_INCEPTION_YEAR=2025
# POM_URL=https://github.com/your-org/your-repo/
# POM_DEVELOPER_ID=your-username
# POM_DEVELOPER_NAME=Your Name
# POM_DEVELOPER_URL=https://github.com/your-username/
# POM_SCM_URL=https://github.com/your-org/your-repo/

# AGP 9.0 Compatibility Flags (Preserving 8.13 behaviors during migration)

# Disables resValues by default in all subprojects. Projects requiring resValues must set buildFeatures.resValues = true.
android.defaults.buildfeatures.resvalues=true

# Prevents the target SDK version from defaulting to the compile SDK version if unset (reverts to min SDK default).
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false

# Disables non-final R class compilation in applications to maintain compatibility with constant requirements (e.g., switch cases).
android.enableAppCompileTimeRClass=false

# In AGP 9.0, Android library and feature module publishing will fail if consumer keep files contain global options.
android.usesSdkInManifest.disallowed=false

# Disables the enforcement of unique package names across all libraries in the project.
android.uniquePackageNames=false

# Disables dependency constraints optimizations that reduce import time but limit constraint usage to Android tests.
android.dependency.useConstraints=true

# Disables R8 full mode for keep rules (maintains implicit keeping of default constructors when a class is kept).
android.r8.strictFullModeForKeepRules=false

# Disables optimized resource shrinking that considers classes and resources together.
android.r8.optimizedResourceShrinking=false
